name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install (single hoisted workspace tree)
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build (server + client)
        run: npm run build
        env:
          # Build-time only; runtime secrets are injected by the deploy environment.
          JWT_SECRET: ci-build-not-a-secret
          JWT_REFRESH_SECRET: ci-build-not-a-secret
      - name: Test (server unit tests)
        run: npm test --if-present
