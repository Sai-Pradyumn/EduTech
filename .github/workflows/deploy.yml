name: Deploy

# CD pipeline. On every push to main (or a manual run) we re-run the full build + tests
# as a gate, then trigger Render (backend) and Vercel (frontend) via their deploy hooks.
#
# GitHub-hosted runners are ephemeral CI compute — they cannot HOST the app. Hosting lives
# on Render + Vercel; this workflow only orchestrates the deploys. The deploy steps no-op
# gracefully until you add the two hook secrets (see DEPLOYMENT.md):
#   RENDER_DEPLOY_HOOK_URL   — Render → service → Settings → Deploy Hook
#   VERCEL_DEPLOY_HOOK_URL   — Vercel → project → Settings → Git → Deploy Hooks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build (server + client)
        run: npm run build
        env:
          JWT_SECRET: ci-build-not-a-secret
          JWT_REFRESH_SECRET: ci-build-not-a-secret
      - name: Test (server unit tests)
        run: npm test --if-present

  deploy-backend:
    name: Deploy backend (Render)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping backend deploy."
            exit 0
          fi
          echo "Triggering Render deploy…"
          curl -fsSL -X POST "$HOOK"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL not set — skipping frontend deploy."
            exit 0
          fi
          echo "Triggering Vercel deploy…"
          curl -fsSL -X POST "$HOOK"
