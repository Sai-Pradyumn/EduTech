<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Asta — AI Skill Mentor</title>
  <meta name="description" content="Asta turns learning into a path: a personalized roadmap, an AI tutor, doubt-solving from your notes, quizzes and real projects — orchestrated by AI agents." />
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <!-- PWA (B14) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1b6b4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asta">
  <!-- iOS ignores SVG touch icons — point at the rasterized PNG (Workstream I). -->
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    // Register the service worker (PWA shell caching) in production builds only.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // Set the theme pre-paint to avoid a flash of the wrong theme. ThemeService
    // keeps this in sync at runtime (storage key: asta.theme).
    (function () {
      try {
        var t = localStorage.getItem('asta.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
