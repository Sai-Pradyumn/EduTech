# Asta — training run configuration.
# Consumed by prepare_dataset.py, train_lora.py and evaluate_adapter.py.
# argparse flags on each script override the values here for one-off runs.

# --- Base model -------------------------------------------------------------
# Placeholder. Swap for the model you have access/weights for, e.g.:
#   meta-llama/Meta-Llama-3.1-8B-Instruct
#   mistralai/Mistral-7B-Instruct-v0.3
#   Qwen/Qwen2.5-7B-Instruct
# For a no-GPU smoke test pass --base-model sshleifer/tiny-gpt2.
base_model: "meta-llama/Meta-Llama-3.1-8B-Instruct"

# Max sequence length (prompt + response). Longer = more VRAM.
max_seq_length: 1024

# --- Optimization -----------------------------------------------------------
num_train_epochs: 3
learning_rate: 2.0e-4          # higher LR is fine for LoRA (few trainable params)
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
weight_decay: 0.0

per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4 # effective batch = batch * accum * num_gpus
max_grad_norm: 1.0

# Mixed precision. Use bf16 on Ampere+ (A100/H100/4090); fp16 on older cards;
# both false falls back to fp32 (CPU smoke tests).
bf16: true
fp16: false

gradient_checkpointing: true   # trade compute for VRAM; recommended for 7B+

# --- Data split -------------------------------------------------------------
# Fraction of the dataset held out for eval (loss/perplexity).
eval_split: 0.1
seed: 42

# --- Logging / checkpointing ------------------------------------------------
logging_steps: 5
save_steps: 50
eval_steps: 50
save_total_limit: 2

# --- Paths (defaults; overridable via CLI) ----------------------------------
output_dir: "outputs/asta-lora"
dataset_dir: "outputs/dataset"
